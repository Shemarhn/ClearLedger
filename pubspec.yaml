name: clearledger
description: A mobile-first personal finance tracking app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Backend & Network
  supabase_flutter: ^2.12.4
  dio: ^5.9.2
  
  # UI & Charts
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  intl: ^0.20.2
  
  # Hardware & Files
  image_picker: ^1.2.2
  camera: ^0.12.0+1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  
  # Auth & Security
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.1
  shared_preferences: ^2.5.5
  
  # Notifications
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  
  # Export tools
  open_filex: ^4.7.0
  
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
