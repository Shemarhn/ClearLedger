name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Production backend URL
        required: true
        default: https://clearledger-production.up.railway.app
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build tester APK
        run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          --dart-define=API_BASE_URL=${{ github.event.inputs.api_base_url || 'https://clearledger-production.up.railway.app' }}
          --dart-define=ENABLE_PUSH_NOTIFICATIONS=false

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk clearledger-tester.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearledger-apk
          path: clearledger-tester.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: clearledger-tester.apk
